  <circle cx="704" cy="274" r="15" fill="#D9451F"/><text class="t n" x="704" y="280" text-anchor="middle">1</text>
  <text class="t" x="734" y="281" font-size="23" font-weight="700">Definición a un clic</text>
  <text class="t m" x="734" y="312">Cada término se explica donde</text>
  <text class="t m" x="734" y="338">aparece, sin páginas de ayuda.</text>
  <circle cx="704" cy="379" r="15" fill="#D9451F"/><text class="t n" x="704" y="385" text-anchor="middle">2</text>
  <text class="t" x="734" y="386" font-size="23" font-weight="700">La cifra, con su tendencia</text>
  <text class="t m" x="734" y="417">El dato que resuelve la consulta</text>
  <text class="t m" x="734" y="443">y hacia dónde va, de un vistazo.</text>
  <circle cx="704" cy="484" r="15" fill="#D9451F"/><text class="t n" x="704" y="490" text-anchor="middle">3</text>
  <text class="t" x="734" y="491" font-size="23" font-weight="700">El periodo, siempre visible</text>
  <text class="t m" x="734" y="522">Nadie saca conclusiones de un</text>
  <text class="t m" x="734" y="548">dato sin saber qué meses cubre.</text>
  <circle cx="704" cy="589" r="15" fill="#D9451F"/><text class="t n" x="704" y="595" text-anchor="middle">4</text>
  <text class="t" x="734" y="596" font-size="23" font-weight="700">Gráfico o tabla</text>
  <text class="t m" x="734" y="627">Porque no todo el mundo lee</text>
  <text class="t m" x="734" y="653">un dato de la misma manera.</text>
  <text class="t" x="80" y="714" font-size="23" font-weight="700">La misma pieza en todo el panel de estadísticas</text>
