<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Wireframe anotado de la pantalla de mapa del portal">
  <style>
    .t { font-family: Inter, system-ui, sans-serif; fill: #1B2430; }
    .h { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
    .s { font-size: 21px; fill: #6B7A8C; }
    .m { font-size: 16px; fill: #6B7A8C; }
    .n { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .k { font-size: 14px; fill: #8496A8; letter-spacing: 2px; }
  </style>
  <rect width="1200" height="750" fill="#F6F9FC"/>

  <text class="t k" x="80" y="86">03 · LA SOLUCIÓN</text>
  <text class="t h" x="80" y="140">El mapa como puerta de entrada</text>
  <text class="t s" x="80" y="182">Nadie sabe decir «código postal 08015», pero todo el mundo sabe señalar dónde vive.</text>

  <!-- pantalla -->
  <g>
    <rect x="80" y="226" width="700" height="452" rx="16" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="2"/>

    <!-- buscador -->
    <rect x="80" y="226" width="700" height="70" rx="16" fill="#16407A"/>
    <rect x="80" y="272" width="700" height="24" fill="#16407A"/>
    <rect x="104" y="244" width="608" height="34" rx="8" fill="#FFFFFF"/>
    <rect x="124" y="256" width="220" height="10" rx="5" fill="#B9C7D8"/>
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
      <path d="M732 254h20M732 261h20M732 268h20"/>
    </g>

    <!-- leyenda -->
    <rect x="104" y="318" width="652" height="10" rx="5" fill="#F0A05A"/>
    <circle cx="104" cy="323" r="8" fill="#FFFFFF" stroke="#D9451F" stroke-width="3"/>
    <circle cx="756" cy="323" r="8" fill="#FFFFFF" stroke="#D9451F" stroke-width="3"/>

    <!-- zonas -->
    <g stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">
      <path d="M128 366 L300 356 L330 430 L240 476 L138 456 Z" fill="#FBD9B4"/>
      <path d="M300 356 L470 366 L496 438 L330 430 Z" fill="#F3AE72"/>
      <path d="M470 366 L700 358 L716 436 L496 438 Z" fill="#FBD9B4"/>
      <path d="M240 476 L330 430 L496 438 L510 546 L262 574 Z" fill="#D9451F"/>
      <path d="M496 438 L716 436 L706 552 L510 546 Z" fill="#EC8B4A"/>
      <path d="M138 456 L240 476 L262 574 L146 566 Z" fill="#F3AE72"/>
    </g>
    <path d="M240 476 L330 430 L496 438 L510 546 L262 574 Z" fill="none" stroke="#16407A" stroke-width="5" stroke-linejoin="round"/>
    <rect x="318" y="470" width="140" height="46" rx="10" fill="#1B2430"/>
    <text class="t" x="388" y="500" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">1.995 €/m²</text>

    <!-- acciones -->
    <rect x="104" y="606" width="150" height="42" rx="21" fill="#16407A"/>
    <rect x="124" y="622" width="96" height="10" rx="5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="450" y="606" width="140" height="42" rx="21" fill="#E7EEF6"/>
    <rect x="606" y="606" width="150" height="42" rx="21" fill="#D9451F"/>
    <rect x="628" y="622" width="106" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- numeros -->
  <g>
    <circle cx="120" cy="261" r="15" fill="#D9451F"/><text class="t n" x="120" y="267" text-anchor="middle">1</text>
    <circle cx="430" cy="323" r="15" fill="#D9451F"/><text class="t n" x="430" y="329" text-anchor="middle">2</text>
    <circle cx="388" cy="418" r="15" fill="#D9451F"/><text class="t n" x="388" y="424" text-anchor="middle">3</text>
    <circle cx="179" cy="627" r="15" fill="#D9451F"/><text class="t n" x="179" y="633" text-anchor="middle">4</text>
    <circle cx="681" cy="627" r="15" fill="#D9451F"/><text class="t n" x="681" y="633" text-anchor="middle">5</text>
  </g>

  <!-- leyenda lateral -->
  <g transform="translate(824 250)">
    <g class="t">
      <circle cx="13" cy="0" r="13" fill="#D9451F"/><text class="n" x="13" y="6" text-anchor="middle">1</text>
      <text font-size="18" font-weight="600" x="40" y="6">Buscar o filtrar</text>
      <text class="m" x="0" y="34">Provincia, municipio o código postal;</text>
      <text class="m" x="0" y="56">tipo de finca y de construcción aparte.</text>

      <circle cx="13" cy="106" r="13" fill="#D9451F"/><text class="n" x="13" y="112" text-anchor="middle">2</text>
      <text font-size="18" font-weight="600" x="40" y="112">Escala que filtra</text>
      <text class="m" x="0" y="140">La leyenda de precio es a la vez</text>
      <text class="m" x="0" y="162">lectura del mapa y control.</text>

      <circle cx="13" cy="212" r="13" fill="#D9451F"/><text class="n" x="13" y="218" text-anchor="middle">3</text>
      <text font-size="18" font-weight="600" x="40" y="218">La cifra, primero</text>
      <text class="m" x="0" y="246">El precio medio de la zona resuelve</text>
      <text class="m" x="0" y="268">la consulta de la mayoría.</text>

      <circle cx="13" cy="318" r="13" fill="#D9451F"/><text class="n" x="13" y="324" text-anchor="middle">4</text>
      <text font-size="18" font-weight="600" x="40" y="324">Dibujar tu área</text>
      <text class="m" x="0" y="352">Para lo que no cabe en una</text>
      <text class="m" x="0" y="374">división administrativa.</text>

      <circle cx="13" cy="424" r="13" fill="#D9451F"/><text class="n" x="13" y="430" text-anchor="middle">5</text>
      <text font-size="18" font-weight="600" x="40" y="430">Más estadísticas</text>
      <text class="m" x="0" y="458">La segunda capa, para quien</text>
      <text class="m" x="0" y="480">necesita el detalle.</text>
    </g>
  </g>

  <text class="t m" x="80" y="716">Esquema propio: reconstruye las decisiones de la pantalla, no es una captura del portal.</text>
</svg>
