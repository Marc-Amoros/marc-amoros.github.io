<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Wireframe esquemático del cuadro de instrumentos con las decisiones de jerarquía anotadas">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1430"/>
      <stop offset="1" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="cuadro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241b3c"/>
      <stop offset="1" stop-color="#160f28"/>
    </linearGradient>
    <linearGradient id="arco" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9d6bff"/>
      <stop offset="1" stop-color="#b48fff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#9d6bff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9d6bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .t  { font-family: Inter, system-ui, sans-serif; fill: #f4f2f8; }
    .h  { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
    .s  { font-size: 21px; fill: #a79fb8; }
    .m  { font-size: 16px; fill: #a79fb8; }
    .n  { font-size: 15px; font-weight: 700; fill: #17102a; }
    .k  { font-size: 14px; fill: #8b81a3; letter-spacing: 2px; }

    /* El arco de energía se dibuja solo y las llamadas van cayendo en orden:
       se lee el cuadro por donde se mira primero. */
    .traza { stroke-dasharray: 260; stroke-dashoffset: 260;
             animation: traza 1.1s cubic-bezier(0.2, 0, 0, 1) 200ms both; }
    .marca { transform-box: fill-box; transform-origin: 50% 50%;
             animation: brota 520ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    .m1 { animation-delay: 340ms; } .m2 { animation-delay: 480ms; }
    .m3 { animation-delay: 620ms; } .m4 { animation-delay: 760ms; }
    @keyframes traza { to { stroke-dashoffset: 0; } }
    @keyframes brota { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .traza { animation: none; stroke-dashoffset: 0; }
      .marca { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect width="1200" height="750" fill="url(#fondo)"/>
  <ellipse cx="460" cy="395" rx="480" ry="320" fill="url(#halo)"/>

  <text class="t k" x="80" y="86">03 · LA SOLUCIÓN</text>
  <text class="t h" x="80" y="140">Jerarquía por tamaño, color reservado al estado</text>
  <text class="t s" x="80" y="182">Wireframe del cuadro: lo que se mira de reojo va grande y centrado; lo demás, a los lados.</text>

  <!-- marco del cuadro -->
  <g transform="translate(80 230)">
    <rect x="0" y="0" width="760" height="330" rx="26" fill="url(#cuadro)" stroke="#2c2246" stroke-width="2"/>

    <!-- energia / regeneracion, izquierda -->
    <path d="M60 250 A130 130 0 0 1 118 88" fill="none" stroke="#2c2246" stroke-width="18" stroke-linecap="round"/>
    <path class="traza" d="M60 250 A130 130 0 0 1 74 172" fill="none" stroke="url(#arco)" stroke-width="18" stroke-linecap="round"/>
    <rect x="44" y="278" width="96" height="12" rx="6" fill="#2c2246"/>

    <!-- velocidad, centro -->
    <rect x="286" y="96" width="188" height="86" rx="10" fill="#332856"/>
    <rect x="330" y="196" width="100" height="16" rx="8" fill="#261d40"/>

    <!-- limite de velocidad -->
    <circle cx="380" cy="56" r="26" fill="none" stroke="#5b4b87" stroke-width="6"/>

    <!-- autonomia y navegacion, derecha -->
    <rect x="560" y="70" width="156" height="16" rx="8" fill="#332856"/>
    <rect x="560" y="100" width="112" height="16" rx="8" fill="#261d40"/>
    <rect x="560" y="150" width="156" height="90" rx="12" fill="#1d1633" stroke="#2c2246" stroke-width="2"/>
    <path d="M614 226 L638 176 L662 226 L638 208 Z" fill="#5b4b87"/>

    <!-- franja de modos -->
    <g fill="#261d40">
      <rect x="286" y="262" width="60" height="30" rx="15"/>
      <rect x="356" y="262" width="60" height="30" rx="15"/>
      <rect x="426" y="262" width="60" height="30" rx="15"/>
    </g>
    <rect x="356" y="262" width="60" height="30" rx="15" fill="#9d6bff"/>

    <!-- llamadas -->
    <g>
      <circle class="marca m1" cx="380" cy="139" r="16" fill="#b48fff"/><text class="t n marca m1" x="380" y="145" text-anchor="middle">1</text>
      <circle class="marca m2" cx="90" cy="170" r="16" fill="#b48fff"/><text class="t n marca m2" x="90" y="176" text-anchor="middle">2</text>
      <circle class="marca m3" cx="638" cy="195" r="16" fill="#b48fff"/><text class="t n marca m3" x="638" y="201" text-anchor="middle">3</text>
      <circle class="marca m4" cx="386" cy="277" r="16" fill="#b48fff"/><text class="t n marca m4" x="386" y="283" text-anchor="middle">4</text>
    </g>
  </g>

  <!-- leyenda -->
  <g transform="translate(890 250)">
    <g class="t">
      <circle cx="14" cy="0" r="14" fill="#b48fff"/><text class="n" x="14" y="6" text-anchor="middle">1</text>
      <text class="s" font-size="18" fill="#f4f2f8" x="42" y="6">Velocidad</text>
      <text class="m" x="0" y="34">El dato que más se consulta:</text>
      <text class="m" x="0" y="56">el más grande y el más centrado.</text>

      <circle cx="14" cy="110" r="14" fill="#b48fff"/><text class="n" x="14" y="116" text-anchor="middle">2</text>
      <text class="s" font-size="18" fill="#f4f2f8" x="42" y="116">Energía</text>
      <text class="m" x="0" y="144">Consumo y regeneración en un arco:</text>
      <text class="m" x="0" y="166">se entiende sin leer una cifra.</text>

      <circle cx="14" cy="220" r="14" fill="#b48fff"/><text class="n" x="14" y="226" text-anchor="middle">3</text>
      <text class="s" font-size="18" fill="#f4f2f8" x="42" y="226">Autonomía y ruta</text>
      <text class="m" x="0" y="254">Lo específico del eléctrico,</text>
      <text class="m" x="0" y="276">a un lado y siempre presente.</text>

      <circle cx="14" cy="330" r="14" fill="#b48fff"/><text class="n" x="14" y="336" text-anchor="middle">4</text>
      <text class="s" font-size="18" fill="#f4f2f8" x="42" y="336">Modo de conducción</text>
      <text class="m" x="0" y="364">Único uso del color de marca:</text>
      <text class="m" x="0" y="386">marca estado, no decora.</text>
    </g>
  </g>

  <text class="t m" x="80" y="700">Esquema propio hecho para explicar el método. No reproduce la interfaz final del vehículo.</text>
</svg>
