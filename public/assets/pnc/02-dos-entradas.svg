<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Dos columnas de entrada al portal, por nombre del trámite o por hecho de la vida, que confluyen en el mismo trámite">
  <style>
    .t { font-family: Inter, system-ui, sans-serif; fill: #263238; }
    .h { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
    .s { font-size: 21px; fill: #6B7A8C; }
    .l { font-size: 19px; font-weight: 600; }
    .m { font-size: 18px; fill: #546E7A; }
    .k { font-size: 14px; fill: #8D99A5; letter-spacing: 2px; }
    .w { fill: #FFFFFF; }
  </style>
  <rect width="1200" height="750" fill="#F6F8FA"/>

  <text class="t k" x="80" y="86">02 · INVESTIGACIÓN</text>
  <text class="t h" x="80" y="140">Dos maneras de llegar, un solo trámite</text>
  <text class="t s" x="80" y="182">Unos traen aprendido el nombre técnico. Otros solo saben lo que les ha pasado.</text>

  <text class="t k" x="80" y="248">SABE CÓMO SE LLAMA</text>
  <g fill="#FFFFFF" stroke="#DCE5EC" stroke-width="2">
    <rect x="80" y="272" width="452" height="62" rx="12"/>
    <rect x="80" y="348" width="452" height="62" rx="12"/>
    <rect x="80" y="424" width="452" height="62" rx="12"/>
  </g>
  <g class="t m">
    <text x="110" y="311">«Legitimación de firma»</text>
    <text x="110" y="387">«Copia autorizada electrónica»</text>
    <text x="110" y="463">«Acta de presencia»</text>
  </g>

  <text class="t k" x="668" y="248">SABE LO QUE LE HA PASADO</text>
  <g fill="#FFFFFF" stroke="#DCE5EC" stroke-width="2">
    <rect x="668" y="272" width="452" height="62" rx="12"/>
    <rect x="668" y="348" width="452" height="62" rx="12"/>
    <rect x="668" y="424" width="452" height="62" rx="12"/>
  </g>
  <g class="t m">
    <text x="698" y="311">«He heredado un piso»</text>
    <text x="698" y="387">«Vendo mi casa»</text>
    <text x="698" y="463">«Monto una empresa»</text>
  </g>

  <g stroke="#009AE5" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M306 500v42h294v42"/>
    <path d="M894 500v42H600v42"/>
    <path d="M588 572l12 12 12-12"/>
  </g>

  <rect x="308" y="596" width="584" height="86" rx="16" fill="#263238"/>
  <text class="t l w" x="600" y="634" text-anchor="middle">El mismo trámite</text>
  <text x="600" y="662" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#8D99A5">Las dos entradas conviven en la misma pantalla</text>
</svg>
