<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 544" width="1200" height="544" role="img" aria-label="El portal publicado y disponible en cuatro canales: gratuito, en el navegador, en aplicación móvil y por teléfono">
  <style>
    .t { font-family: Inter, system-ui, sans-serif; fill: #263238; }
    .h { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
    .s { font-size: 21px; fill: #6B7A8C; }
    .m { font-size: 18px; fill: #546E7A; }
    .k { font-size: 14px; fill: #8D99A5; letter-spacing: 2px; }
  </style>
  <rect width="1200" height="544" fill="#F6F8FA"/>

  <text class="t k" x="80" y="86">04 · RESULTADOS</text>
  <text class="t h" x="80" y="140">Un portal, cuatro maneras de llegar</text>
  <text class="t s" x="80" y="182">Publicado y gratuito, en ocho idiomas: por el navegador, la app o el teléfono.</text>

  <!-- gratuito -->
  <g>
    <rect x="80" y="230" width="242" height="190" rx="16" fill="#FFFFFF" stroke="#DCE5EC" stroke-width="2"/>
    <circle cx="201" cy="284" r="30" fill="#E3F4FD"/>
    <path d="M192 284 L199 291 L210 276" fill="none" stroke="#009AE5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="201" y="348" text-anchor="middle" style="font-family:Inter, system-ui, sans-serif; font-weight:700; font-size:17px; fill:#263238">Gratuito</text>
    <text x="201" y="374" text-anchor="middle" style="font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#546E7A">Sin coste para nadie.</text>
  </g>

  <!-- navegador -->
  <g>
    <rect x="346" y="230" width="242" height="190" rx="16" fill="#FFFFFF" stroke="#DCE5EC" stroke-width="2"/>
    <circle cx="467" cy="284" r="30" fill="#E3F4FD"/>
    <rect x="454" y="274" width="26" height="20" rx="3" fill="none" stroke="#009AE5" stroke-width="2"/>
    <line x1="454" y1="280" x2="480" y2="280" stroke="#009AE5" stroke-width="2"/>
    <circle cx="458" cy="277" r="1.3" fill="#009AE5"/>
    <circle cx="463" cy="277" r="1.3" fill="#009AE5"/>
    <text x="467" y="348" text-anchor="middle" style="font-family:Inter, system-ui, sans-serif; font-weight:700; font-size:17px; fill:#263238">Navegador</text>
    <text x="467" y="374" text-anchor="middle" style="font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#546E7A">Desde cualquier ordenador.</text>
  </g>

  <!-- app movil -->
  <g>
    <rect x="612" y="230" width="242" height="190" rx="16" fill="#FFFFFF" stroke="#DCE5EC" stroke-width="2"/>
    <circle cx="733" cy="284" r="30" fill="#E3F4FD"/>
    <rect x="725" y="271" width="16" height="26" rx="4" fill="none" stroke="#009AE5" stroke-width="2"/>
    <circle cx="733" cy="293" r="1.4" fill="#009AE5"/>
    <text x="733" y="348" text-anchor="middle" style="font-family:Inter, system-ui, sans-serif; font-weight:700; font-size:17px; fill:#263238">App iOS y Android</text>
    <text x="733" y="374" text-anchor="middle" style="font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#546E7A">También en el móvil.</text>
  </g>

  <!-- telefono -->
  <g>
    <rect x="878" y="230" width="242" height="190" rx="16" fill="#FFFFFF" stroke="#DCE5EC" stroke-width="2"/>
    <circle cx="999" cy="284" r="30" fill="#E3F4FD"/>
    <path d="M990 286 A9 9 0 0 1 1008 286" fill="none" stroke="#009AE5" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="988" y="285" width="5" height="8" rx="2.5" fill="#009AE5"/>
    <rect x="1005" y="285" width="5" height="8" rx="2.5" fill="#009AE5"/>
    <text x="999" y="348" text-anchor="middle" style="font-family:Inter, system-ui, sans-serif; font-weight:700; font-size:17px; fill:#263238">Atención telefónica</text>
    <text x="999" y="374" text-anchor="middle" style="font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#546E7A">Para resolverlo hablando.</text>
  </g>

  <text class="t m" x="80" y="470">Gratuito, en el navegador y en aplicación móvil, con atención telefónica para quien prefiere</text>
  <text class="t m" x="80" y="494">resolverlo hablando, y todo ello en ocho idiomas.</text>
</svg>
